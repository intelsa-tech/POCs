<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tierra Querida Auto-Ops - Intelsa POC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .lucide { vertical-align: middle; display: inline-block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // Extraemos de forma segura después de que todo cargó
        const { useState, useEffect, useRef } = React;
        const { 
            AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer 
        } = window.Recharts;

        // Componente de Icono Ultra-Seguro
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={`${className}`} style={{ width: size, height: size }}></i>;
        };

        // --- DATOS ---
        const sedesReales = [
            "Bogotá Modelia", "El Santuario", "Cali 2 Los Mangos", "Caldas La Dorada", "12 de Octubre",
            "Campo Valdes", "Piedecuesta", "Porvenir", "La Ceja 1", "Bello 3 Niquia", "Turbo",
            "Bogotá Castilla", "Itagüí 1 Santa Maria", "Neiva", "Santa Marta 1 Rodadero", "Buga",
            "Medellín Castilla", "Itagüí 2 Fatima", "Buenaventura", "Dosquebradas", "Barrio Antioquia",
            "Bucaramanga 1 Estadio", "San Antonio de Prado", "Bogotá Lucero Bajo", "Bogotá Normandía",
            "Pedregal", "Cali 5 la Novena", "Barrio Obrero Cocina Oculta", "Zamora", "Guatapé",
            "La Ceja 2", "Centro Comercial Bosque Plaza", "Bello 4 Goretti", "La América", "Montelíbano",
            "Armenia 1 Nogal", "Barbosa", "Pereira 3 La Julia", "Llanogrande", "Palmira", "Copacabana",
            "Medellin San Cristóbal", "Barranquilla 1 La bomba", "Bogotá Suba 2", "Ibagué", "Soledad",
            "Calasanz", "Santa Rosa de Cabal", "Cali 4 La Flora", "Marinilla", "Armenia 3 Las Acacias",
            "Manizales 3 Milán", "Bucaramanga 2 Sotomayor", "Centro Comercial SantaFe", "Bogotá Restrepo",
            "Belén Las Mercedes", "Laureles la 70", "Envigado", "Pereira 1 Cuba", "San Antonio de Pereira",
            "Barrancabermeja Parnaso", "Armenia 2 Granada", "Cali 3 Valle de Lili", "Sabaneta 2 Parque",
            "Cartagena 1 Caracoles", "Bello 5 París", "San Javier 1", "Madrid", "Aranjuez", "Santa Cruz",
            "Cartagena 2 Las Gaviotas", "Bogotá Ciudad Montes", "El Peñol", "Girardota", "Caldas",
            "Belén Cocina Oculta", "Sabaneta 1", "Cali 1 Villa Colombia", "Bogotá Villas de Granada",
            "Centro Comercial Premium Plaza", "El Carmen de Viboral", "Cartagena 3 Manga", "Montería",
            "Manizales 2", "Robledo", "Yomasa Bogotá", "Chigorodó", "San Javier 2 Comuna 13", "Caucasia",
            "Bogotá Chapinero", "Santo Domingo Savio", "Bello 1 Parque", "Milagrosa",
            "Santa Marta 2 Sector Universidad", "Manrique", "Guarne", "Barranquilla 2 la Octava",
            "Carepa", "Villa Hermosa", "Apartadó", "Buenos Aires", "Sincelejo", "Cartago",
            "Manizales 1 La Estrella"
        ];

        const locationData = sedesReales.map((name, index) => ({
            name,
            pedidos: 40 + ((index * 17) % 150),
            tiempo: parseFloat((2 + ((index * 7) % 6)).toFixed(1)),
            abandono: parseFloat((0.5 + ((index * 3) % 4)).toFixed(1)),
            ticket: 35000 + ((index * 1000) % 15000)
        })).sort((a, b) => b.pedidos - a.pedidos);

        const nacionalStats = {
            pedidos: locationData.reduce((acc, curr) => acc + curr.pedidos, 0),
            ingresos: locationData.reduce((acc, curr) => acc + (curr.pedidos * curr.ticket), 0),
            tiempo: 4.2,
            abandono: 2.1
        };

        const baseHourlyData = [
            { time: '12pm', pct: 40 }, { time: '2pm', pct: 25 }, { time: '4pm', pct: 15 },
            { time: '6pm', pct: 55 }, { time: '8pm', pct: 80 }, { time: '10pm', pct: 30 }
        ];

        // --- APP ---
        function TierraQueridaDashboard() {
            const formatCurrency = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(val);

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-4xl font-black text-slate-900 flex items-center gap-3">
                                🍔 Tierra Querida <span className="text-orange-500">Auto-Ops</span>
                            </h1>
                            <p className="text-slate-500 font-medium flex items-center gap-2 mt-1">
                                <span className="flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                Control de Órdenes IA — Powered by Intelsa
                            </p>
                        </div>
                        <div className="bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm font-bold text-orange-600">
                           {new Date().toLocaleDateString()} — VIVO
                        </div>
                    </header>

                    {/* KPI CARDS */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex items-center gap-2 text-blue-600 font-bold mb-2">
                                <Icon name="dollar-sign" /> Ingresos Hoy
                            </div>
                            <div className="text-3xl font-black">{formatCurrency(nacionalStats.ingresos)}</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex items-center gap-2 text-emerald-600 font-bold mb-2">
                                <Icon name="shopping-bag" /> Pedidos IA
                            </div>
                            <div className="text-3xl font-black">{nacionalStats.pedidos}</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex items-center gap-2 text-amber-600 font-bold mb-2">
                                <Icon name="clock" /> ETA Promedio
                            </div>
                            <div className="text-3xl font-black">{nacionalStats.tiempo} min</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex items-center gap-2 text-red-600 font-bold mb-2">
                                <Icon name="trending-down" /> Abandono
                            </div>
                            <div className="text-3xl font-black">{nacionalStats.abandono}%</div>
                        </div>
                    </div>

                    {/* CHART & RANKING */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm h-[450px]">
                            <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                                <Icon name="activity" className="text-orange-500" /> Curva de Demanda (IA Ops)
                            </h3>
                            <ResponsiveContainer width="100%" height="90%">
                                <AreaChart data={baseHourlyData}>
                                    <defs>
                                        <linearGradient id="colorOrange" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#f97316" stopOpacity={0.3}/>
                                            <stop offset="95%" stopColor="#f97316" stopOpacity={0}/>
                                        </linearGradient>
                                    </defs>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                    <XAxis dataKey="time" axisLine={false} tickLine={false} />
                                    <Tooltip contentStyle={{ borderRadius: '15px', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }} />
                                    <Area type="monotone" dataKey="pct" stroke="#f97316" strokeWidth={4} fill="url(#colorOrange)" />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>

                        <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                            <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                                <Icon name="map-pin" className="text-purple-500" /> Top Sedes
                            </h3>
                            <div className="space-y-4">
                                {locationData.slice(0, 6).map((sede, i) => (
                                    <div key={i} className="flex items-center justify-between p-3 hover:bg-slate-50 rounded-xl transition-colors">
                                        <div>
                                            <div className="font-bold text-slate-800">{sede.name}</div>
                                            <div className="text-xs text-slate-400">{sede.pedidos} pedidos hoy</div>
                                        </div>
                                        <div className="text-emerald-500 font-mono font-bold">{sede.tiempo}m</div>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-8 p-4 bg-orange-50 rounded-2xl border border-orange-100 text-sm text-orange-900">
                                <strong>Insight:</strong> La sede {locationData[0].name} lidera el volumen. Sugerimos activar refuerzo de cocina.
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TierraQueridaDashboard />);
    </script>
</body>
</html>
